# Paramètres du pipeline, suivis par DVC (dvc params diff).
# Le contrat des données (colonnes, cible, split, métriques, seuil) est dans dataset.yaml.
prepare:
  id_column: request_id
  event_timestamp: "2026-01-01T00:00:00+00:00"

train:
  model: logistic_regression
  C: 0.1
  class_weight: balanced
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.1
  random_state: 42

drift:
  ks_alpha: 0.05
  psi_threshold: 0.25
  drift_share: 0.1
  simulation:
    scale:
      credit_amount: 1.4
      duration: 1.3
    shift:
      age: -8
